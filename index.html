<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17120f" />
  <meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
  <title>Chronos — wiek w zapisie rzymskim</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23c99a52'/%3E%3Cpath d='M32 16v17l11 7' stroke='%2317120f' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; --ink:#efe3cc; --muted:#a99982; --gold:#c99a52; --line:#534537; --panel:#211914; --bg:#17120f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% -10%, #3c291d 0, var(--bg) 52%); color:var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    main { min-height:100vh; max-width:760px; margin:auto; padding:clamp(28px,8vw,88px) 22px 36px; display:flex; flex-direction:column; }
    header { text-align:center; }
    .mark { color:var(--gold); font-size:28px; letter-spacing:8px; }
    .eyebrow { margin:14px 0 0; color:var(--muted); text-transform:uppercase; letter-spacing:.22em; font:12px/1.4 Arial, sans-serif; }
    h1 { margin:18px auto 10px; max-width:650px; font-size:clamp(34px,8vw,64px); line-height:1.03; font-weight:400; letter-spacing:-.03em; }
    .intro { margin:0 auto; color:var(--muted); font-size:17px; line-height:1.5; }
    .card { margin:clamp(38px,9vw,76px) auto 0; width:100%; max-width:620px; padding:clamp(22px,6vw,44px); background:linear-gradient(145deg, rgba(50,36,26,.95), rgba(30,22,17,.98)); border:1px solid var(--line); box-shadow:0 24px 70px rgba(0,0,0,.3); position:relative; }
    label { display:block; margin-bottom:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.16em; font:12px Arial,sans-serif; }
    .row { display:flex; gap:10px; }
    input { min-width:0; flex:1; border:1px solid #806547; border-radius:2px; background:#120e0b; color:var(--ink); padding:16px 18px; font:24px Georgia,serif; outline:none; }
    input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,154,82,.15); }
    button { border:0; border-radius:2px; background:var(--gold); color:#1b130d; padding:0 22px; font:bold 14px Arial,sans-serif; letter-spacing:.05em; cursor:pointer; }
    button:hover { background:#e1b66d; } button:active { transform:translateY(1px); }
    .result { min-height:142px; margin-top:28px; padding-top:27px; border-top:1px solid var(--line); text-align:center; }
    .result-label { color:var(--muted); font:12px Arial,sans-serif; text-transform:uppercase; letter-spacing:.18em; }
    .century { margin-top:8px; color:var(--gold); font-size:clamp(62px,16vw,112px); line-height:1; letter-spacing:.05em; }
    .hint { color:var(--muted); font-size:15px; line-height:1.4; }
    footer { margin-top:auto; padding-top:56px; text-align:center; color:#756556; font:12px Arial,sans-serif; letter-spacing:.08em; }
    @media (max-width:420px) { .row{flex-direction:column} button{height:52px} input{width:100%} .card{padding:28px 20px} }
  </style>
</head>
<body>
  <main>
    <header><div class="mark">✦</div><p class="eyebrow">Chronos - który to wiek?</p></header>
    <section class="card" aria-label="Obliczanie wieku">
      <form id="form"><label for="year">Wpisz rok</label><div class="row"><input id="year" name="year" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="np. 1410" autocomplete="off" /><button type="submit">Oblicz</button></div></form>
      <div class="result" aria-live="polite"><div class="result-label">Wiek</div><div id="century" class="century">—</div></div>
    </section>
    <footer>AD MMXXVI · MIARĄ CZASU JEST PAMIĘĆ</footer>
  </main>
  <script>
    const form=document.getElementById('form'), input=document.getElementById('year'), output=document.getElementById('century'), hint=document.getElementById('hint');
    const roman=n=>{let s='', vals=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];for(const [v,c] of vals){while(n>=v){s+=c;n-=v}}return s};
    input.addEventListener('focus',()=>input.select());
    form.addEventListener('submit',e=>{e.preventDefault(); const year=input.value.trim(); if(!/^\d{4}$/.test(year)||Number(year)<1){output.textContent='—';return} const century=Math.ceil(Number(year)/100); output.textContent=roman(century);});
    if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
    }
  </script>
</body>
</html>
